<!DOCTYPE html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>시대인재 변주엽T</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{--blue:#1D7ABD;--blue-l:#EAF3FB;--ink:#1A2230;--sub:#6B7480;--sub2:#4B5563;--line:#E6E9EE;--line2:#EEF0F3;--bg2:#F5F7FA;--red:#E5484D;--org:#C2410C;--org-l:#FFF0E0;--acc:#E8590C;--acc-l:#FFF0E0}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
a{color:var(--blue);text-decoration:none}
button{font-family:inherit;cursor:pointer}
.app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.main{flex:1;padding:22px 20px 96px;display:flex;flex-direction:column;gap:14px}
.hd{display:flex;justify-content:space-between;align-items:center}
.hd small{font-size:12px;color:var(--sub);display:block}
.hd b{font-size:24px;font-weight:800;letter-spacing:-.5px}
.icon-btn{width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;position:relative;color:var(--ink)}
.dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:5px;background:var(--acc);border:2px solid #fff}
.avatar{width:48px;height:48px;border-radius:24px;background:var(--acc-l);color:var(--acc);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;border:1.5px solid #FFD3A8}
.clstabs{display:flex;gap:18px;border-bottom:1px solid var(--line);overflow-x:auto}
.clstabs button{border:0;background:none;font-size:16px;padding:6px 0 10px;color:var(--sub);white-space:nowrap;margin-bottom:-1px;border-bottom:3px solid transparent}
.clstabs button.on{color:var(--ink);font-weight:700;border-bottom-color:var(--acc)}
.card{border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:12px}
.card.soft{background:var(--bg2);border:0}
.ttl{font-size:18px;font-weight:800}
.ttl small{font-size:12px;color:var(--sub);font-weight:400;margin-left:6px}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.muted{color:var(--sub);font-size:13px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;background:var(--bg2);padding:5px 9px;border-radius:6px}
.chip i{width:6px;height:6px;border-radius:3px;background:var(--acc);display:inline-block}
.badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:6px;white-space:nowrap}
.b-blue{background:var(--blue-l);color:var(--blue)}.b-org{background:var(--org-l);color:var(--org)}.b-grey{background:#F2F4F7;color:var(--sub2)}
.btn{min-height:50px;border-radius:8px;border:0;background:var(--blue);color:#fff;font-size:15px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 14px;width:100%}
.btn.light{background:var(--blue-l);color:var(--blue)}
.btn.line{background:#fff;border:1px solid #DCE1E7;color:var(--ink);font-weight:500}
.btn.dark{background:var(--ink)}
.btn:disabled{opacity:.45}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.lrow{display:flex;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid var(--line2);color:var(--ink);min-height:44px}
.lrow:last-child{border-bottom:0}
.lrow .k{width:68px;font-size:14px;font-weight:700;flex-shrink:0}
.lrow .v{flex:1;font-size:14px}
.bar{height:8px;background:var(--line2);border-radius:4px;overflow:hidden}.bar>span{display:block;height:8px;background:var(--blue)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;background:#F2F4F7;border-radius:8px;padding:4px}
.seg button{min-height:44px;border:0;border-radius:6px;background:transparent;color:var(--sub2);font-size:14px}
.seg button.on{background:var(--blue);color:#fff;font-weight:700}
.pick{min-height:46px;border-radius:8px;border:1px solid #DCE1E7;background:#fff;color:var(--ink);font-size:14px}
.pick.on{border:1.5px solid var(--blue);background:var(--blue-l);color:var(--blue);font-weight:700}
.pick:disabled{color:#A6AEB9;background:#fff}
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);height:68px;display:flex;justify-content:center;z-index:5;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));width:100%;max-width:520px}
nav.tabs button{min-width:0;padding:0;border:0;letter-spacing:-0.3px;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10.5px;color:var(--sub);white-space:nowrap}
nav.tabs button.on{color:var(--acc);font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;color:var(--sub2);font-weight:500}
.field input,textarea{border:0;background:var(--bg2);border-radius:8px;padding:14px;font-size:16px;font-family:inherit;color:var(--ink);width:100%}
.err{color:var(--red);font-size:13px;min-height:18px}
.tl{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line2)}
.tl .d{width:12px;height:12px;border-radius:6px;margin-top:5px;flex-shrink:0}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal button{height:46px;border:0;border-radius:8px;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:transparent;color:var(--ink)}
.cal button.open{background:#F2F4F7}.cal button.sel{background:var(--blue);color:#fff;font-weight:800}
.cal button:disabled{color:#B8BFC8}
.cal i{width:5px;height:5px;border-radius:3px;display:block}
.nums{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.nums a,.nums span{height:40px;border-radius:6px;font-size:13px;display:flex;align-items:center;justify-content:center}
.nums a{background:var(--blue);color:#fff;font-weight:700}.nums span{background:var(--bg2);color:var(--sub)}
.player{width:100%;aspect-ratio:16/9;border-radius:10px;background:#0F1720;overflow:hidden}
.player iframe{width:100%;height:100%;border:0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;font-size:14px;z-index:20;max-width:90%;text-align:center}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80vh;gap:16px;text-align:center}
.spin{width:40px;height:40px;border-radius:20px;border:4px solid var(--line);border-top-color:var(--blue);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* ---------- 시작 ---------- */
function snapSave(){try{if(S.me&&S.data)localStorage.setItem('gwm_snap',JSON.stringify({me:S.me,kid:S.kid&&S.kid.id,cls:S.cls,data:S.data}));}catch(e){}}
function typing(){var a=document.activeElement;return a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT');}
function applyBoot(r,quiet){
  if(!r.me){return oldBoot();}
  S.me=r.me;
  if(!r.me.kids.length){renderNoKid();return;}
  S.kid=r.me.kids.filter(function(x){return x.id===r.kid;})[0]||r.me.kids[0];S.cls=r.cls;S.data=r.data;
  store('gwm_kid',S.kid.id);store('gwm_cls',S.cls);snapSave();
  if(!(quiet&&typing()))render();
}
/* 문제 진단: 오류를 서버 실행 기록에 남김 (선생님이 볼 수 있게) */
var GWM_VER='v44';
function report(where,e){try{fetch(GWM_API,{method:'POST',credentials:'omit',body:JSON.stringify({fn:'__log',args:[where,String(e&&(e.stack||e.message)||e).slice(0,800),navigator.userAgent,GWM_VER]})});}catch(x){}}
window.addEventListener('error',function(ev){report('error',ev.error||ev.message);});
window.addEventListener('unhandledrejection',function(ev){report('promise',ev.reason);});
function stuck(msg){
  if(S.booted)return;
  $('app').innerHTML='<div class="center" style="gap:12px;padding:24px;text-align:center"><div style="font-weight:800;font-size:17px">불러오지 못하고 있어요</div><div class="muted" style="font-size:13px;word-break:break-all">'+esc(msg||'응답을 기다리는 중이에요')+'</div><button class="btn" style="max-width:260px" onclick="location.reload()">다시 시도</button><button class="btn line" style="max-width:260px" onclick="resetLogin()">로그아웃하고 다시 로그인</button></div>';
}
function bootDone(){S.booted=true;store('gwm_booting',null);}
function resetLogin(){['gwm_token','gwm_snap','gwm_kid','gwm_cls'].forEach(function(k){store(k,null);});S.token=null;S.me=null;S.data=null;S.booted=false;renderLogin();}
function boot(){
  S.token=load('gwm_token');
  if(!S.token){renderLogin();return;}
  S.booted=false;
  // 자동 복구: 지난번에 끝까지 못 열었으면(25초 넘게 표시만 남음) 저장해 둔 지난 화면을 버리고 새로 받음
  var pend=Number(load('gwm_booting')||0);
  if(pend&&Date.now()-pend>25000){report('selfheal','지난번 열기 미완료');store('gwm_snap',null);}
  store('gwm_booting',String(Date.now()));
  var snap=null;try{snap=JSON.parse(load('gwm_snap')||'null');}catch(e){}
  if(snap&&snap.me&&snap.data){
    try{applyBoot(snap);}   // 지난번 화면을 바로 보여 주고
    catch(e){report('snap',e);store('gwm_snap',null);snap=null;}   // 저장된 화면이 깨졌으면 버림
  }
  if(!snap) $('app').innerHTML='<div class="center"><div class="spin"></div><div class="muted">불러오는 중이에요.</div></div>';
  var timer=setTimeout(function(){report('slow','20s apiBoot');stuck('20초가 지나도 응답이 없어요.');},20000);
  call('apiBoot',S.token,{kid:load('gwm_kid'),cls:load('gwm_cls')}).then(function(r){clearTimeout(timer);try{applyBoot(r,!!snap);bootDone();}catch(e){report('render',e);stuck('화면을 그리다 오류가 났어요: '+(e&&e.message||e));}})   // 뒤에서 새로 고침
  .catch(function(e){clearTimeout(timer);report('apiBoot',e);if(!S.token)return;if(snap){bootDone();return;}oldBoot();});
}
function oldBoot(){
  call('apiMe',S.token).then(function(me){
    S.me=me;
    if(!me.kids.length){renderNoKid();return;}
    var kid=load('gwm_kid'),k=me.kids.filter(function(x){return x.id===kid;})[0]||me.kids[0];
    S.kid=k; var c=load('gwm_cls'); S.cls=(k.classes.filter(function(x){return x.id===c;})[0]||k.classes[0]).id;
    loadData().then(function(){bootDone();});
  }).catch(function(e){report('apiMe',e);stuck(e&&e.message||e);});
}
function loadData(keepView){
  if(!keepView) $('app').innerHTML='<div class="center"><div class="spin"></div><div class="muted">불러오는 중이에요.</div></div>';
  return call('apiData',S.token,S.kid.id,S.cls).then(function(d){S.data=d;snapSave();if(!(keepView&&typing()))render();}).catch(function(e){$('app').innerHTML='<div class="center"><div class="muted">'+esc(e.message||e)+'</div><button class="btn" style="max-width:240px" onclick="boot()">다시 시도</button></div>';});
}
function logout(silent){
  if(S.token&&!silent)call('apiLogout',S.token);
  store('gwm_token',null);store('gwm_snap',null);S.token=null;S.me=null;S.data=null;renderLogin();
}

/* ---------- 로그인·가입 ---------- */
function renderLogin(mode){
  store('gwm_booting',null);
  mode=mode||'login';
  var h='<div class="main" style="padding-top:48px;padding-bottom:40px">';
  h+='<div class="logo" role="img" aria-label="함께수학 변주엽T" style="width:88px;height:88px;border-radius:18px"></div>';
  h+='<div><div style="font-size:24px;font-weight:800">함께수학 변주엽T</div><div class="muted" style="margin-top:4px">'+(mode==='login'?'학부모 전화번호로 로그인해요.':'처음 한 번만 가입하면 돼요. 학생과 학부모가 같이 써요.')+'</div></div>';
  if(mode==='signup'){
    h+='<div class="field"><label for="fcode">반 코드</label><input id="fcode" autocomplete="off" placeholder="선생님께 받은 코드" style="text-transform:uppercase"></div>';
    h+='<div class="field"><label for="fname">학생 이름</label><input id="fname" autocomplete="off"></div>';
  }
  h+='<div class="field"><label for="fphone">학부모 전화번호</label><input id="fphone" inputmode="numeric" placeholder="010-0000-0000"></div>';
  h+='<div class="field"><label for="fpw">비밀번호'+(mode==='signup'?' (새로 정하기, 4자리 이상)':'')+'</label><input id="fpw" type="password"></div>';
  h+='<div class="err" id="ferr"></div>';
  h+='<button class="btn" id="fgo" onclick="'+(mode==='login'?'doLogin()':'doSignup()')+'">'+(mode==='login'?'로그인':'가입하기')+'</button>';
  h+=mode==='login'?'<button class="btn line" onclick="renderLogin(\'signup\')">처음 가입하기</button><div class="muted">비밀번호를 잊었으면 선생님께 말씀해 주세요.</div>':'<button class="btn line" onclick="renderLogin()">이미 가입했어요</button><div class="muted">같은 번호로 형제·자매가 있으면, 반 코드와 이름만 바꿔 한 번 더 가입해 주세요.</div>';
  h+='</div>';
  $('app').innerHTML=h;
}
function authBusy(on,label){var b=$('fgo');if(!b)return;if(on){b.disabled=true;b.innerHTML='<span class="spin" style="width:18px;height:18px;border-width:3px;border-top-color:#fff;display:inline-block;vertical-align:-3px"></span>&nbsp; '+label;}else{b.disabled=false;b.innerHTML=b.dataset.t;}}
function authDone(r,msg){
  if(!r.ok){authBusy(false);$('ferr').textContent=r.msg;return;}
  S.token=r.token;store('gwm_token',r.token);store('gwm_snap',null);if(msg)toast(msg);
  if(r.me)applyBoot(r);else oldBoot();
}
function doLogin(){
  var b=$('fgo');b.dataset.t=b.innerHTML;$('ferr').textContent='';authBusy(true,'로그인 중');
  call('apiLogin',{phone:$('fphone').value,password:$('fpw').value},{kid:load('gwm_kid'),cls:load('gwm_cls')}).then(function(r){authDone(r);})
  .catch(function(e){authBusy(false);$('ferr').textContent=e.message||'잠시 후 다시 시도해 주세요.';});
}
function doSignup(){
  var b=$('fgo');b.dataset.t=b.innerHTML;$('ferr').textContent='';authBusy(true,'가입하는 중');
  call('apiSignup',{code:$('fcode').value,name:$('fname').value,phone:$('fphone').value,password:$('fpw').value},{}).then(function(r){authDone(r,'가입됐어요');})
  .catch(function(e){authBusy(false);$('ferr').textContent=e.message||'잠시 후 다시 시도해 주세요.';});
}
function renderNoKid(){$('app').innerHTML='<div class="center"><div class="muted">지금 수강 중인 반이 없어요.</div><button class="btn line" style="max-width:240px" onclick="logout()">로그아웃</button></div>';}

/* ---------- 공통 틀 ---------- */
function header(){
  var d=S.data,k=S.kid,h='<div class="hd"><div><small><b style="display:inline;font-size:inherit;color:var(--blue)">시대인재 변주엽T</b> · '+esc(d.now)+' 기준</small><b>'+esc(k.name)+' 학생</b></div>';
  h+='<div style="display:flex;align-items:center;gap:6px"><button class="icon-btn" aria-label="알림함" onclick="go(\'notice\')">'+ICON.bell+(d.notices.length?'<span class="dot"></span>':'')+'</button>';
  h+='<button class="avatar" aria-label="내 정보" onclick="go(\'info\')">'+esc(k.name.slice(-2))+'</button></div></div>';
  h+='<div class="clstabs">'+k.classes.map(function(c){return '<button class="'+(c.id===S.cls?'on':'')+'" onclick="pickClass(\''+c.id+'\')">'+esc(c.name)+'</button>';}).join('')+'</div>';
  return h;
}
function tabs(){
  return '<nav class="tabs" aria-label="메뉴"><div class="in">'+TABS.map(function(t){return '<button class="'+((S.view===t[0]||(t[0]==='apply'&&/^(absent|care|msg|pastvideo)$/.test(S.view))||(t[0]==='score'&&/^(qlist|qview)$/.test(S.view)))?'on':'')+'" onclick="go(\''+t[0]+'\')">'+ICON[t[0]]+esc(t[1])+'</button>';}).join('')+'</div></nav>';
}
function go(v,extra){S.apDone=null;stopPlayer();if(v!=='ask')S.askBack=null;S.view=v;if(extra)for(var k in extra)S[k]=extra[k];render();window.scrollTo(0,0);}
function pickClass(id){S.cls=id;store('gwm_cls',id);loadData();}
function render(){
  var v=S.view,body='';
  if(v==='video'){$('app').innerHTML=viewVideo();mountPlayer();return;}
  body=({home:viewHome,hw:viewHw,score:viewScore,qlist:viewQList,qview:viewQOne,lecture:viewLecture,sol:viewSol,clinic:viewClinic,apply:viewApplyHub,ask:viewAsk,absent:function(){return viewApply(2);},care:function(){return viewApply(1);},msg:function(){return viewApply(0);},pastvideo:viewPastVideo,info:viewInfo,notice:viewNotice})[v]();
  $('app').innerHTML='<div class="main">'+header()+body+'</div>'+tabs();
}

/* ---------- 홈 ---------- */
function viewHome(){
  var d=S.data,h='';
  if(d.homeNotice) h+='<a href="javascript:void 0" onclick="openRound('+d.homeNotice.round+')" style="display:flex;align-items:center;gap:10px;border:2px solid var(--blue);border-radius:10px;padding:14px 18px;min-height:56px"><span style="flex:1;font-size:17px;font-weight:800">'+md(d.homeNotice.date)+' 수업 안내</span><span style="font-size:14px;font-weight:700">보기 ›</span></a>';
  h+=guideCard();
  if(d.cls&&d.cls.page)h+='<a class="card" href="'+esc(d.cls.page)+'" target="_blank" rel="noopener" style="flex-direction:row;align-items:center;gap:12px;color:var(--ink);padding:14px 18px"><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span class="ttl">'+esc(d.cls.name||'우리 반')+' 수업 안내</span><span class="muted" style="font-size:12px">수업 방식 · 과제 · 규칙</span></span><span style="font-weight:700;color:var(--blue)">열기 ↗</span></a>';
  // 다음 수업까지
  var nx=d.next,last=d.last;
  h+='<div class="card" style="gap:0"><div class="row" style="padding-bottom:6px"><span class="ttl">다음 수업까지</span><span class="muted">'+(nx?md(nx.date)+'('+nx.dow+') 수업':'')+'</span></div>';
  var cur=last?last:null;
  // 이번 과제: 시즌 파일 반 탭 위 두 줄 제목(회차별 과제) → 없으면 회차 자료 과제공지 → 교재 범위
  var hwl=cur?((cur.task&&cur.task.length)?cur.task.slice():hwLines(cur.notice||cur.range||('교재 '+cur.n+'회차'))):[];
  h+='<a class="lrow" href="javascript:void 0" onclick="go(\'hw\',{sub:0})" style="align-items:flex-start"><span class="k" style="padding-top:2px">이번 과제</span><span class="v" style="display:flex;flex-direction:column;gap:6px">'+(hwl.length?hwl.map(function(t){return '<span style="display:flex;gap:8px;align-items:baseline;line-height:1.45"><i style="width:6px;height:6px;border-radius:3px;background:var(--blue);flex-shrink:0;transform:translateY(-2px)"></i><span>'+esc(t)+'</span></span>';}).join(''):'<span class="muted">아직 없어요</span>')+'</span><span class="muted" style="padding-top:2px">›</span></a>';
  h+='<a class="lrow" href="javascript:void 0" onclick="go(\'hw\',{sub:0})" style="align-items:flex-start"><span class="k" style="padding-top:4px">밀린 과제</span><span class="v" style="display:flex;flex-wrap:wrap;gap:6px">';
  h+=d.pending.length?d.pending.slice(-6).map(function(p){return '<span class="chip"><i></i>'+esc(p.what.replace('교재 ','').replace('회차','회'))+' '+esc(p.detail)+'</span>';}).join(''):'<span class="muted" style="padding-top:4px">없어요</span>';
  h+='</span><span class="muted" style="padding-top:4px">›</span></a><span class="muted" style="font-size:12px;padding-top:4px">다음 수업에서 같이 검사해요</span></div>';
  // 내 공부 기록 — 칸 = 수업일. n회차 과제는 n+1회차 수업일에 검사하므로, 그 날 칸에는 앞 회차 과제의 검사 결과를 표시
  var rs=d.rounds.filter(function(r){return r.date&&r.date<=d.today;}).slice(-8);
  function prevHw(r){var p=d.rounds[r.n-2];return p&&p.hw?p.hw:{};}
  if(rs.length){
    h+='<div class="card"><div class="row"><span class="ttl">내 공부 기록</span><span class="muted" style="font-size:12px">수업일마다 지난 과제 검사</span></div><div>';
    function mTask(v,r){if(r.att==='결석'||r.att==='동영상'||!v)return'N';if(/미제출|안함/.test(v))return'X';if(v==='100'||v==='완료'||Number(v)===100)return'F';if(parseFloat(v)>0)return'H';return'X';}
    function mWrong(v,r){if(r.att==='결석'||r.att==='동영상'||!v)return'N';if(/미제출|안함/.test(v))return'X';return parseFloat(v)>0?'H':'F';}
    var F=[['done',mTask],['wrong',mWrong],['ex',mTask],['exWrong',mWrong]];
    var labels=(d.cls&&d.cls.rec&&d.cls.rec.length)?d.cls.rec:['과제','오답'];
    var rows=labels.slice(0,4).map(function(lb,i){return [lb,function(r){return F[i][1](String(prevHw(r)[F[i][0]]||'').trim(),r);}];});
    rows.push(['클리닉',function(r){if(r.att!=='현강')return'N';var a=r.after||'';if(!a)return'N';if(/\d{1,2}:\d{2}\s*~/.test(a))return'F';if(/미입실|✗|미완료/.test(a))return'X';return'F';}]);
    var lw=labels.some(function(x){return x.length>4;})?96:50;
    rows.forEach(function(row){
      h+='<div style="display:flex;align-items:center;border-bottom:1px solid var(--line2);min-height:40px"><span style="width:'+lw+'px;flex:none;font-size:12px;line-height:1.3;color:var(--sub2);word-break:keep-all">'+esc(row[0])+'</span><div style="flex:1;display:grid;grid-template-columns:repeat('+rs.length+',minmax(0,1fr))">';
      rs.forEach(function(r){h+='<span class="mark">'+mark(row[1](r))+'</span>';});
      h+='</div></div>';
    });
    h+='<div style="display:flex;height:26px"><span style="width:'+lw+'px;flex:none"></span><div style="flex:1;display:grid;grid-template-columns:repeat('+rs.length+',minmax(0,1fr));font-size:10px;color:var(--sub);text-align:center">'+rs.map(function(r){return '<span>'+md(r.date)+'</span>';}).join('')+'</div></div></div>';
    h+='<div style="display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--sub2)"><span>'+mark('F',12)+' 했어요</span><span>'+mark('H',12)+' 덜 했어요</span><span>'+mark('X',11)+' 못 했어요</span><span>'+mark('N')+' 검사 없음·결석·동영상</span></div>';
    // 가장 최근 과제 검사 (n회차 과제 → n+1회차 수업일에 검사)
    var chk=null;for(var i=d.rounds.length-1;i>=0;i--){var r=d.rounds[i],x=r.hw||{};if(x.done||x.wrong||x.ex||x.exWrong){chk=r;break;}}
    if(chk){
      var at=d.rounds[chk.n]||null, cd=at&&at.date?at.date:'';
      var hx=chk.hw, tasks=(chk.task&&chk.task.length)?chk.task:[];
      function cLine(lb,v,kind){v=String(v||'').trim();if(!v)return '';
        var st=kind==='t'?mTask(v,{}):mWrong(v,{}),txt;
        if(kind==='t')txt=/미제출|안함/.test(v)?v:(/^\d+(\.\d+)?$/.test(v)?v+'%':v);
        else txt=/미제출|안함/.test(v)?v:(parseFloat(v)>0?'남은 오답 '+parseFloat(v)+'문항':'남은 오답 없음');
        return '<div style="display:flex;gap:10px;align-items:center;font-size:14px"><span style="width:18px;display:flex;justify-content:center">'+mark(st,14)+'</span><span style="min-width:88px;color:var(--sub)">'+esc(lb)+'</span><span style="flex:1">'+esc(txt)+'</span></div>';}
      h+='<div class="card soft" style="gap:10px;padding:14px"><div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:800">'+(cd?md(cd)+'('+dowOf(cd)+') ':'')+'과제 검사</span><span class="muted" style="font-size:12px">'+chk.n+'회차'+(chk.date?'('+md(chk.date)+')':'')+'에 나간 과제'+(tasks.length?' · '+esc(tasks.join(' · ')):'')+'</span></div>';
      var keys=[['done','t'],['wrong','w'],['ex','t'],['exWrong','w']], lbs=labels.length>=2?labels:['과제','오답'];
      keys.forEach(function(k,i){h+=cLine(lbs[i]||(k[1]==='t'?'과제':'오답'),hx[k[0]],k[1]);});
      h+='</div>';
    }
    h+='<button class="btn light" onclick="go(\'hw\',{sub:1})">회차 기록 보기</button></div>';
  }
  h+='<div class="grid2"><button class="btn line" onclick="go(\'absent\')">결석 알리기</button><button class="btn line" onclick="go(\'pastvideo\')">지난 수업 영상 신청</button><button class="btn line" onclick="go(\'care\')">귀가·관리 요청</button><button class="btn line" onclick="go(\'clinic\')">클리닉 예약</button><button class="btn line" style="grid-column:1/-1" onclick="go(\'msg\')">선생님께 메시지</button></div>';
  return h;
}
/* ---------- 과제 안내 (문구는 gowithmath 웹 › 설정 탭) ---------- */
var GUIDE_DEF={title:'과제 안내',summary:'[교재 40문제] + [공수리뷰 10문제]\n매시간 · 오답까지 · 테스트 오답은 당일 완료',must:'교재 | 매시간 [40문제] | 오답까지\n공수리뷰과제 | 매시간 [10문제] | 오답까지\n테스트 오답 | [당일 남아서 모두 완료] // (3회마다 오답노트 한 번 더)',extraNote:'여력이 있는 학생은 해 주면 더 좋아요',extra:'추가연습문제 | 매시간 [30문제] | 미적분1\n테스트 유사문제 | 유사문항 복습',wrong:'클래스룸 해설영상 | | sol\n선생님께 요청 | 카톡 · 웹페이지 | apply\n클리닉 | 월~토 2시~5시 · 추후 다시 안내 | clinic\n해설지'};
function hl(s){return esc(s).replace(/\[([^\]]+)\]/g,'<mark class="hl">$1</mark>').replace(/\s*\/\/\s*/g,'<br>');}
function gLines(s){return String(s||'').split(/\r?\n/).map(function(l){return l.trim();}).filter(String).map(function(l){return l.split('|').map(function(x){return x.trim();});});}
function gLink(x){var lab={ask:'질문하기',sol:'보기',lecture:'보기',apply:'요청',clinic:'예약',hw:'보기',score:'보기'};
  if(/^https?:\/\//.test(x||''))return '<a href="'+esc(x)+'" target="_blank" rel="noopener" style="font-size:13px;font-weight:700;white-space:nowrap">열기 ↗</a>';
  if(lab[x])return '<a href="javascript:void 0" onclick="go(\''+x+'\')" style="font-size:13px;font-weight:700;white-space:nowrap">'+lab[x]+' ›</a>';return '';}
function toggleGuide(){S.guideOpen=!S.guideOpen;render();}
function guideCard(){
  var g=S.data.hwGuide,def=GUIDE_DEF;if(!g||!(g.must||g.summary))g=def;
  var open=!!S.guideOpen,badge='<span class="badge" style="background:var(--blue);color:#fff;padding:3px 8px">필수</span>';
  var h='<div class="card" style="gap:12px"><button onclick="toggleGuide()" aria-expanded="'+open+'" style="display:flex;justify-content:space-between;align-items:center;border:0;background:none;padding:0;color:var(--ink);text-align:left;min-height:28px"><span class="ttl">'+esc(g.title||'과제 안내')+'</span><span style="font-size:13px;font-weight:700;color:var(--blue)">'+(open?'접기 ⌃':'자세히 ⌄')+'</span></button>';
  if(!open){
    var sm=String(g.summary||'').split(/\r?\n/).filter(function(x){return x.trim();});
    h+='<div style="display:flex;flex-direction:column;gap:6px"><div style="display:flex;gap:8px;align-items:center;font-size:14px;font-weight:700">'+badge+'<span>'+hl(sm[0]||'')+'</span></div>'+(sm.length>1?'<div style="font-size:13px;color:var(--sub2);padding-left:46px;line-height:1.5">'+hl(sm.slice(1).join(' '))+'</div>':'')+'</div>';
    h+='<div class="grid2"><button class="btn" style="min-height:42px;font-size:13px;background:var(--bg2);color:var(--ink)" onclick="toggleGuide()">추가과제</button><button class="btn light" style="min-height:42px;font-size:13px" onclick="toggleGuide()">오답 막힐 때</button></div>';
    return h+'</div>';
  }
  h+='<div><div style="margin-bottom:2px">'+badge+'</div>'+gLines(g.must).map(function(r){return '<div class="lrow" style="min-height:0;padding:10px 0;align-items:baseline"><span class="k" style="width:96px">'+hl(r[0])+'</span><span class="v">'+hl(r[1]||'')+(r[2]?' <span class="muted" style="font-size:12px">· '+hl(r[2])+'</span>':'')+'</span></div>';}).join('')+'</div>';
  var ex=gLines(g.extra);
  if(ex.length)h+='<div><div style="margin-bottom:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span class="badge" style="background:var(--acc);color:#fff;padding:3px 8px">추가</span>'+(g.extraNote?'<span class="muted" style="font-size:12px">'+hl(g.extraNote)+'</span>':'')+'</div>'+ex.map(function(r){return '<div class="lrow" style="min-height:0;padding:10px 0;align-items:baseline"><span class="k" style="width:96px">'+hl(r[0])+'</span><span class="v">'+hl(r[1]||'')+(r[2]?' <span class="muted" style="font-size:12px">· '+hl(r[2])+'</span>':'')+'</span></div>';}).join('')+'</div>';
  var wr=gLines(g.wrong);
  if(wr.length)h+='<div><div style="font-size:15px;font-weight:800;margin-bottom:4px">교재 오답이 안 풀릴 때</div>'+wr.map(function(r,i){return '<div style="display:flex;align-items:flex-start;gap:10px;min-height:40px;font-size:14px;padding:6px 0"><span style="width:22px;height:22px;border-radius:11px;background:var(--blue-l);color:var(--blue);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0">'+(i+1)+'</span><span style="flex:1;display:flex;flex-direction:column;gap:2px;line-height:22px"><span>'+hl(r[0])+'</span>'+(r[1]?hwLines(r[1]).map(function(t){return '<span class="muted" style="font-size:12px;line-height:1.45">'+hl(t)+'</span>';}).join(''):'')+'</span><span style="line-height:22px">'+gLink(r[2])+'</span></div>';}).join('')+'</div>';
  return h+'</div>';
}
// 과제공지를 과제별 줄로: 셀 안 줄바꿈, ' · ', ' / ' 로 나눔
function hwLines(t){return String(t||'').split(/\r?\n|\s+[·\/]\s+/).map(function(x){return x.trim();}).filter(String);}
function mark(t,s){s=s||16;
  if(t==='F')return '<span style="display:inline-block;width:'+s+'px;height:'+s+'px;border-radius:'+s+'px;background:#1D7ABD;vertical-align:-2px"></span>';
  if(t==='H')return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 16 16" style="vertical-align:-2px" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="#fff" stroke="#E8590C" stroke-width="2"/><path d="M8 1a7 7 0 0 1 0 14z" fill="#E8590C"/></svg>';
  if(t==='X')return '<svg width="'+(s-2)+'" height="'+(s-2)+'" viewBox="0 0 14 14" fill="none" stroke="#E5484D" stroke-width="2.5" stroke-linecap="round" style="vertical-align:-1px" aria-hidden="true"><path d="M2 2l10 10M12 2 2 12"/></svg>';
  return '<span style="display:inline-block;width:10px;height:2px;background:#C2C9D2;vertical-align:3px"></span>';}
function line(ok,k,v){return '<div style="display:flex;gap:10px;align-items:center;font-size:14px">'+(ok?ICON.check:ICON.x)+'<span style="width:52px;color:var(--sub)">'+k+'</span><span style="flex:1">'+v+'</span></div>';}

/* ---------- 과제 ---------- */
/* 과제 표시 공통 기준 (홈과 같음): n회차 과제는 n+1회차 수업일에 검사 */
function hwMark(v,kind,att){v=String(v||'').trim();if(att==='결석'||att==='동영상'||!v)return'N';if(/미제출|안함/.test(v))return'X';
  if(kind==='t'){if(v==='100'||v==='완료'||Number(v)===100)return'F';return parseFloat(v)>0?'H':'X';}
  return parseFloat(v)>0?'H':'F';}
function hwText(v,kind){v=String(v||'').trim();if(/미제출|안함/.test(v))return v;
  if(kind==='t')return /^\d+(\.\d+)?$/.test(v)?v+'%':v;
  return parseFloat(v)>0?'남은 오답 '+parseFloat(v)+'문항':'남은 오답 없음';}
var HW_KEYS=[['done','t'],['wrong','w'],['ex','t'],['exWrong','w']];
function hwLabels(){var d=S.data,l=(d.cls&&d.cls.rec&&d.cls.rec.length)?d.cls.rec:[];return HW_KEYS.map(function(k,i){return l[i]||(k[1]==='t'?(i?'과제2':'과제'):(i>1?'과제2 오답':'오답'));});}
function hwHas(hw){hw=hw||{};return !!(hw.done||hw.wrong||hw.ex||hw.exWrong);}
function hwLinesHtml(hw,att){var lb=hwLabels(),h='';
  HW_KEYS.forEach(function(k,i){var v=String((hw||{})[k[0]]||'').trim();if(!v)return;
    h+='<div style="display:flex;gap:10px;align-items:center;font-size:14px"><span style="width:18px;display:flex;justify-content:center">'+mark(hwMark(v,k[1],att),14)+'</span><span style="min-width:88px;color:var(--sub)">'+esc(lb[i])+'</span><span style="flex:1">'+esc(hwText(v,k[1]))+'</span></div>';});
  return h;}
function viewHw(){
  var d=S.data,h='<div class="seg"><button class="'+(S.sub===0?'on':'')+'" onclick="S.sub=0;render()">회차별 과제</button><button class="'+(S.sub===1?'on':'')+'" onclick="S.sub=1;render()">수업일 기록</button></div>';
  var legend='<div style="display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--sub2)"><span>'+mark('F',12)+' 했어요</span><span>'+mark('H',12)+' 덜 했어요</span><span>'+mark('X',11)+' 못 했어요</span></div>';
  if(S.sub===0){
    h+='<div class="card"><div class="row"><span class="ttl">밀린 과제</span><span class="badge '+(d.pending.length?'b-org':'b-blue')+'">'+(d.pending.length?d.pending.length+'개':'없음')+'</span></div>';
    h+=d.pending.length?'<div style="display:flex;flex-wrap:wrap;gap:6px">'+d.pending.map(function(p){return '<span class="chip"><i></i>'+esc(p.what)+' '+esc(p.detail)+'</span>';}).join('')+'</div>':'<div class="muted">밀린 과제가 없어요.</div>';
    h+='<span class="muted" style="font-size:12px">다음 수업에서 같이 검사해요</span></div>';
    var list=d.rounds.filter(function(r){return r.date&&r.date<=d.today;}).slice().reverse();
    if(!list.length)h+='<div class="empty">아직 과제 기록이 없어요.</div>';
    else h+=legend;
    list.forEach(function(r){
      var hw=r.hw||{},nx=d.rounds[r.n]||null,cd=nx&&nx.date?nx.date:'',tasks=(r.task&&r.task.length)?r.task:[];
      var b,bc;
      if(hwHas(hw)){b=(cd?md(cd)+'('+dowOf(cd)+') ':'')+'검사';bc='b-blue';}
      else if(cd&&cd>d.today){b=md(cd)+'('+dowOf(cd)+') 검사 예정';bc='b-grey';}
      else if(nx&&(nx.att==='결석'||nx.att==='동영상')){b=nx.att+' · 검사 못 함';bc='b-grey';}
      else {b='검사 전';bc='b-grey';}
      h+='<div class="card" style="gap:10px;padding:16px 18px"><div class="row" style="align-items:flex-start"><div><div style="font-size:16px;font-weight:800">'+r.n+'회차 과제</div><div class="muted" style="font-size:12px">'+md(r.date)+'('+(r.dow||dowOf(r.date))+') 수업에서 나감</div></div><span class="badge '+bc+'">'+esc(b)+'</span></div>';
      if(tasks.length)h+='<div style="display:flex;flex-direction:column;gap:4px">'+tasks.map(function(t){return '<span style="display:flex;gap:8px;align-items:baseline;font-size:14px;line-height:1.45"><i style="width:6px;height:6px;border-radius:3px;background:var(--blue);flex-shrink:0;transform:translateY(-2px)"></i><span>'+esc(t)+'</span></span>';}).join('')+'</div>';
      if(hwHas(hw))h+='<div style="display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line2);padding-top:10px">'+hwLinesHtml(hw)+'</div>';
      if(r.notice)h+='<div class="muted" style="font-size:12px;line-height:1.6">과제공지<br>'+hwLines(r.notice).map(esc).join('<br>')+'</div>';
      h+='</div>';
    });
    if(d.notes.length){h+='<div class="card"><span class="ttl">오답노트</span>'+d.notes.map(function(n){return '<div class="row" style="font-size:14px"><span>'+esc(n.title)+'</span><span class="muted">'+esc(n.done)+(n.wrong?' · '+esc(n.wrong):'')+'</span></div>';}).join('')+'</div>';}
  } else {
    h+='<div style="display:flex;gap:12px;justify-content:flex-end;font-size:12px;color:var(--sub)"><span>'+dot('현강')+' 현강</span><span>'+dot('동영상')+' 동영상</span><span>'+dot('결석')+' 결석</span></div>';
    var rs=d.rounds.filter(function(r){return r.date;}).slice().reverse(),lb=hwLabels();
    h+='<div class="card" style="gap:0;padding:4px 18px">'+(rs.length?rs.map(function(r){
      var pv=d.rounds[r.n-2]||null,ph=pv?pv.hw||{}:{},body='';
      if(r.date>d.today)body='<span class="muted">예정'+(pv?' · '+pv.n+'회차 과제 검사':'')+'</span>';
      else if(!pv)body='<span class="muted">첫 수업 · 검사할 과제 없음</span>';
      else if(hwHas(ph))body='<span class="muted" style="font-size:12px">'+pv.n+'회차 과제 검사</span><div style="display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px">'+HW_KEYS.map(function(k,i){var v=String(ph[k[0]]||'').trim();if(!v)return '';return '<span style="display:inline-flex;align-items:center;gap:4px">'+mark(hwMark(v,k[1],r.att),12)+esc(lb[i])+'</span>';}).join('')+'</div>';
      else body='<span class="muted">'+((r.att==='결석'||r.att==='동영상')?r.att+' · ':'')+pv.n+'회차 과제 검사 기록 없음</span>';
      return '<div class="tl">'+dot(r.att,12)+'<div style="flex:1;display:flex;flex-direction:column;gap:4px"><div class="row"><span style="font-size:15px;font-weight:800">'+md(r.date)+'('+(r.dow||dowOf(r.date))+') <span style="font-size:12px;font-weight:500;color:var(--sub)">'+r.n+'회'+(r.att?' · '+r.att:'')+'</span></span></div>'+body+(r.after?'<span class="muted" style="font-size:12px">하원·스카 '+esc(r.after)+'</span>':'')+'</div></div>';
    }).join(''):'<div class="empty">아직 수업 기록이 없어요.</div>')+'</div>';
  }
  return h;
}
function dot(att,s){s=s||10;var st=att==='현강'?'background:#1D7ABD':att==='동영상'?'border:2px solid #1D7ABD;background:#fff':att==='결석'?'background:#C2C9D2':'background:#E6E9EE';return '<span style="display:inline-block;width:'+s+'px;height:'+s+'px;box-sizing:border-box;border-radius:'+s+'px;'+st+';'+(s>10?'margin-top:5px;flex-shrink:0':'vertical-align:-1px')+'"></span>';}

/* ---------- 성적 ---------- */
function viewScore(){
  var d=S.data,sc=d.scores,list=sc.list,h=rivalLink();
  var took=list.filter(function(x){return !x.absent;});
  if(!took.length){return h+'<div class="card"><span class="ttl">성적</span><div class="empty">아직 시험 기록이 없어요.</div></div>';}
  var last=took[took.length-1],prev=took.length>1?took[took.length-2]:null,diff=prev?last.score-prev.score:null;
  h+='<div class="card" style="gap:6px"><div class="row" style="align-items:flex-start"><span style="font-size:16px;font-weight:800">'+last.n+'회 테스트'+(String(last.form).length>1?' ('+esc(last.form)+')':'')+'</span>'+(diff!=null?'<span class="badge '+(diff>=0?'b-blue':'b-grey')+'" style="font-size:13px">'+(diff>=0?'▲ ':'▼ ')+Math.abs(diff)+'점</span>':'')+'</div>';
  h+='<div style="display:flex;align-items:baseline;gap:6px"><span style="font-size:52px;font-weight:800;line-height:1.1;letter-spacing:-1px">'+last.score+'</span><span style="font-size:16px;color:var(--sub)">/ '+last.total+'점</span></div>';
  if(prev)h+='<span class="muted">지난 테스트('+prev.score+'점)보다 '+(diff>0?diff+'점 올랐어요':diff<0?(-diff)+'점 내려갔어요':'같아요')+'</span>';
  h+='<div class="grid2" style="border-top:1px solid var(--line2);margin-top:8px;padding-top:12px;gap:0"><div style="border-right:1px solid var(--line2)"><div class="muted" style="font-size:12px">반평균</div><div style="font-size:20px;font-weight:800">'+(last.avg!=null?last.avg:'-')+'</div></div><div style="padding-left:16px"><div class="muted" style="font-size:12px">최고점</div><div style="font-size:20px;font-weight:800">'+(last.max!=null?last.max:'-')+'</div></div></div></div>';
  h+='<div class="card" style="gap:8px"><div class="row"><span class="ttl">성적 추이</span><span style="font-size:11px;color:var(--sub)"><b style="color:#1D7ABD">━</b> 내 점수 <b style="color:#8A94A3">┅</b> 반평균 <b style="color:#D9822B">┄</b> 최고점</span></div>'+chart(took)+'</div>';
  h+=recentCard(sc)+qCard(sc);
  h+='<div class="card" style="gap:0;padding:8px 18px"><span class="ttl" style="padding:10px 0 4px">회차별 결과</span>';
  h+=list.slice().reverse().map(function(x){return '<div class="row" style="padding:12px 0;border-bottom:1px solid var(--line2);align-items:center"><span style="font-size:15px;font-weight:800">'+x.n+'회'+(String(x.form).length>1?' <span class="muted">'+esc(x.form)+'</span>':'')+'</span><span style="font-size:15px;'+(x.absent?'color:var(--sub)':'font-weight:800')+'">'+(x.absent?'미응시':x.score+' / '+x.total)+'</span></div>';}).join('');
  return h+'</div>';
}
/* 최근 5회 분석 (예전 학습 리포트와 같은 기준) */
function rateColor(r){return r>=80?'var(--blue)':r>=70?'#D9A33B':'var(--org)';}
function rateBars(list,w){return list.map(function(x){return '<div style="display:flex;align-items:center;gap:8px;font-size:13px;min-height:24px"><span style="width:'+(w||104)+'px;flex:none;word-break:keep-all;line-height:1.3">'+esc(x.name)+'</span><span style="flex:1;height:8px;background:var(--bg2);border-radius:2px;overflow:hidden"><span style="display:block;height:100%;width:'+x.rate+'%;background:'+rateColor(x.rate)+'"></span></span><span style="width:38px;text-align:right;font-weight:800;color:'+rateColor(x.rate)+'">'+x.rate+'%</span><span class="muted" style="width:40px;text-align:right;font-size:11px">'+x.right+'/'+x.asked+'</span></div>';}).join('');}
function eunNeun(w){var t=String(w).replace(/[^가-힣]+$/,''),c=t.charCodeAt(t.length-1);if(!(c>=0xAC00&&c<=0xD7A3))return w+'은(는)';return w+((c-0xAC00)%28?'은':'는');}
function recentSummary(u){if(!u.length)return '';var mx=u[0].rate,mn=u[u.length-1].rate;
  var top=u.filter(function(x){return x.rate===mx;}).map(function(x){return x.name;}),bot=u.filter(function(x){return x.rate===mn;}).map(function(x){return x.name;});
  if(mn>=70)return '모든 단원이 70% 이상으로 안정적이에요.';
  if(mx===mn)return eunNeun(bot.join('·'))+' '+mn+'%로 보완이 필요해요.';
  return eunNeun(top.join('·'))+' '+mx+'%로 안정적이고, '+eunNeun(bot.join('·'))+' '+mn+'%로 보완이 필요해요.';}
function recentCard(sc){var R=sc.recent;if(!R||!R.units||!R.units.length)return '';
  var h='<div class="card" style="gap:12px"><div class="row"><span class="ttl">최근 5회 분석</span><span class="muted" style="font-size:12px">'+(R.from===R.to?R.from+'회':R.from+'~'+R.to+'회')+'</span></div>';
  h+='<div style="font-size:14px;font-weight:700;line-height:1.5">'+esc(recentSummary(R.units))+'</div>';

function sq(c){return '<span style="display:inline-block;width:14px;height:14px;border-radius:4px;background:'+c+';vertical-align:-2px"></span>';}
function fmtT(s){s=Math.floor(s);var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0');}
function drawBar(){
  var b=$('vbar');if(!b)return;var h='',i=0;

  if(V.dur)h+='<span style="position:absolute;top:0;height:12px;width:3px;background:#1A2230;left:'+Math.min(99.5,V.last/V.dur*100)+'%"></span>';

}
function mountPlayer(){
  drawBar();if(!V.r.youtubeId)return;

    clearInterval(V.timer);V.timer=setInterval(tick,1000);}
  if(window.YT&&YT.Player)make();else{window.onYouTubeIframeAPIReady=make;if(!document.getElementById('ytapi')){var s=document.createElement('script');s.id='ytapi';s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s);}}

function tick(){
  if(!S.player||!S.player.getPlayerState)return;
  if(S.player.getPlayerState()!==1)return;
  var t=S.player.getCurrentTime(),d=S.player.getDuration();if(!d)return;V.dur=d;
  if(t-V.last<3&&t>=V.last){var a=Math.floor(V.last/d*100),b=Math.floor(t/d*100);for(var i=a;i<=Math.min(99,b);i++)V.bits[i]='1';V.dirty=true;}
  V.last=t;drawBar();
  if(!V.saveAt||Date.now()-V.saveAt>20000)saveWatch();
}
function seekResume(){if(S.player&&S.player.seekTo){S.player.seekTo(V.r.resume,true);S.player.playVideo();}}
function saveWatch(){if(!V||!V.dirty)return;V.dirty=false;V.saveAt=Date.now();call('apiWatch',S.token,S.kid.id,S.cls,V.round,V.kind,V.bits.join(''),V.dur,V.last).catch(function(){});}

function solKeyOf(){return S.kid.id+'|'+S.cls;}

}
function solPct(n,key){var m=S.solMeta;return m&&m.watch&&m.watch[n+':'+key]||0;}
function solIsInt(no){return /^\d+$/.test(String(no));}
function solOf(n,book,part){return (S.data.solutions[n]||[]).filter(function(x){return x.book===book&&(!part||x.part===part);});}
function solMax(list){var m=0;list.forEach(function(x){if(solIsInt(x.no))m=Math.max(m,Number(x.no));});return m;}
function solMin(list){var m=0;list.forEach(function(x){if(solIsInt(x.no)){var v=Number(x.no);if(!m||v<m)m=v;}});return m;}

function solGrid(n,list,from,to){

}
function viewPastVideo(){
  var d=S.data,h='<div style="display:flex;align-items:center;gap:6px;padding:2px 0"><button class="icon-btn" aria-label="뒤로" onclick="go(\'apply\')" style="font-size:22px">‹</button><span style="font-size:20px;font-weight:800">지난 수업 영상 신청</span></div>';
  var past=d.rounds.filter(function(r){return r.date&&r.date<d.today&&r.att==='결석';}).reverse();
  var asked={};d.applications.forEach(function(a){if(a.kind==='결석+동영상')asked[a.date]=1;});
  h+='<div class="card" style="gap:10px"><div class="ttl" style="font-size:15px">결석한 수업을 골라 주세요</div>';
  if(!past.length)h+='<div class="muted" style="padding:6px 0">결석한 지난 수업이 없어요</div>';
  past.forEach(function(r){var done=!r.locked||asked[r.date];
    h+='<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line2);flex-direction:row;align-items:center"><span style="font-size:15px;font-weight:700">'+md(r.date)+'('+r.dow+') <span class="muted" style="font-size:12px;font-weight:400">'+r.n+'회</span></span>'+(done?'<span class="badge b-blue">신청됨</span>':'<button class="btn" style="min-height:40px;width:auto;padding:0 16px;font-size:13px" onclick="if(confirm(\''+md(r.date)+' 수업 영상을 신청할까요?\'))sendApply(\'결석+동영상\',\''+r.date+'\',\'\',this)">영상 신청</button>')+'</div>';});
  h+='<div class="row card soft" style="padding:12px 14px;flex-direction:row;font-size:13px"><span style="color:var(--sub2)">동영상 보충</span><span><b>'+d.video.used+'회</b> 사용</span></div>';
  h+='<div class="muted" style="text-align:center;font-size:12px">신청하면 학부모님 휴대폰으로 알림톡이 가요</div></div>';
  if(S.apDone&&S.apDone.kind==='결석+동영상')h='<div class="card soft" style="padding:12px 14px;font-size:14px;font-weight:700;color:var(--blue)">'+esc(S.apDone.label)+' 신청이 접수됐어요</div>'+h;
  return h;
}
var SENDING=false;
function busy(btn,on){if(!btn)return;if(on){btn.dataset.t=btn.innerHTML;btn.innerHTML='<span class="spin" style="width:18px;height:18px;border-width:3px;border-top-color:#fff;display:inline-block;vertical-align:-3px"></span>&nbsp; 보내는 중';btn.disabled=true;}else{btn.innerHTML=btn.dataset.t||btn.innerHTML;btn.disabled=false;}}
function sendApply(kind,date,text,btn){
  if(SENDING)return;SENDING=true;busy(btn,true);
  var tab=S.apTab||0;
  call('apiApply',S.token,{sid:S.kid.id,cid:S.cls,kind:kind,date:date,text:text||''}).then(function(r){
    SENDING=false;busy(btn,false);
    if(!r.ok){toast(r.msg);return;}
    var label=kind==='결석+동영상'?'결석 + 동영상 보충':kind;if(kind.indexOf('결석')===0)label=md(date)+' '+label;
    S.apDone={tab:tab,kind:kind,label:label,text:text,at:r.at||''};
    if(kind==='메시지')S.msgDraft='';S.careKind=null;
    render();window.scrollTo(0,0);loadData(true);
  }).catch(function(e){SENDING=false;busy(btn,false);toast(e.message||'잠시 후 다시 시도해 주세요');});
}
function msgCount(el){var n=el.value.length,c=$('msgcnt');if(c){c.textContent=n+' / 3000자'+(n>=3000?' · 더 쓰려면 나눠서 보내 주세요':'');c.style.color=n>=3000?'var(--red)':'';}}
function sendMsg(btn){var t=$('msg').value.trim();S.msgDraft=t;if(!t){toast('내용을 적어 주세요');return;}sendApply('메시지',S.data.today,t,btn);}

/* ---------- 내 정보 · 알림함 ---------- */
function viewInfo(){
  var me=S.me,h='<div class="ttl" style="font-size:22px">내 정보</div>';
  h+='<div class="card" style="font-size:15px"><div style="display:flex;gap:16px"><b style="width:84px">학생</b><span>'+esc(S.kid.name)+'</span></div><div style="display:flex;gap:16px"><b style="width:84px">수강</b><span>'+S.kid.classes.map(function(c){return esc(c.name);}).join(', ')+'</span></div><div style="display:flex;gap:16px"><b style="width:84px">학부모 번호</b><span>'+esc(me.phone)+'</span></div></div>';
  if(me.kids.length>1){h+='<div class="card" style="gap:10px"><span class="ttl">자녀 전환</span>'+me.kids.map(function(k){var on=k.id===S.kid.id;return '<button class="pick'+(on?' on':'')+'" style="min-height:60px;padding:0 14px;display:flex;align-items:center;gap:12px;text-align:left" onclick="pickKid(\''+k.id+'\')"><span class="avatar" style="width:40px;height:40px;font-size:13px">'+esc(k.name.slice(-2))+'</span><span style="flex:1"><b style="display:block;color:var(--ink)">'+esc(k.name)+'</b><span class="muted" style="font-size:12px">'+k.classes.map(function(c){return esc(c.name);}).join(', ')+'</span></span>'+(on?'<span style="font-size:12px">보는 중</span>':'')+'</button>';}).join('')+'</div>';}
  h+='<div class="card" style="gap:10px"><span class="ttl">비밀번호 변경</span><div class="field"><input id="npw" type="password" placeholder="새 비밀번호 (4자리 이상)"></div><button class="btn line" onclick="changePw()">바꾸기</button></div>';
  h+='<button class="btn line" onclick="logout()">로그아웃</button>';
  h+='<div class="muted" style="line-height:1.6">기록은 선생님이 입력한 뒤 조금 지나서 반영돼요. 이상한 점이 있으면 신청 › 선생님께 메시지로 알려 주세요.</div>';
  return h;
}
function pickKid(id){var k=S.me.kids.filter(function(x){return x.id===id;})[0];S.kid=k;store('gwm_kid',id);S.cls=k.classes[0].id;S.view='home';loadData();}
function changePw(){var p=$('npw').value;call('apiChangePassword',S.token,{password:p}).then(function(r){toast(r.ok?'바뀌었어요':r.msg);});}
function viewNotice(){
  var n=S.data.notices,h='<div class="ttl" style="font-size:22px">알림함</div>';
  if(!n.length)return h+'<div class="empty">새 알림이 없어요.</div>';
  return h+n.map(function(x){return '<div class="card" style="gap:6px"><div class="row"><b>'+esc(x.title)+'</b><span class="muted" style="font-size:12px">'+esc(x.date)+'</span></div>'+(x.text?'<span style="font-size:14px;line-height:1.6;white-space:pre-line">'+esc(x.text)+'</span>':'')+(x.go?'<button class="btn light" onclick="go(\''+esc(x.go)+'\')">보러 가기</button>':'')+'</div>';}).join('');
}

window.addEventListener('beforeunload',saveWatch);
document.addEventListener('visibilitychange',function(){if(document.hidden)saveWatch();});
if(!window.GWM_PAGE)boot();
</script>
</body>
</html>
